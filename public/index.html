<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>FARMY — Smart Farming Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/farmy.css">
</head>
<body>
  <div id="appwrap">
    <div class="screen">
      <div class="backend-status-pill"></div>

      <div class="home-header">
        <div>
          <p class="greeting">Welcome back,</p>
          <h1 id="homeFarmerName" class="farmer-name">Farmer 👋</h1>
        </div>
        <a href="login.html" id="homeAvatar" class="avatar" title="Account / Profile">F</a>
      </div>

      <a href="crops.html" class="searchbar">
        <span>🔍</span>
        <span style="color: var(--ink-soft); font-size: 14.5px;">Search a crop — tomato, rice, mango…</span>
      </a>

      <a href="recommend.html" class="cta-banner">
        <div>
          <div class="cta-title">Find Suitable Crop</div>
          <div class="cta-sub">Answer a few questions about your land</div>
        </div>
        <div class="cta-arrow">→</div>
      </a>

      <a href="weather.html" class="weather-card">
        <div id="homeWeatherTemp" class="wtemp">29°C</div>
        <div class="wdetails">
          <div id="homeWeatherCond">Partly cloudy</div>
          <div id="homeWeatherSub" class="wsub">Humidity 68% · Rain chance 30%</div>
        </div>
        <div class="wmore">Details →</div>
      </a>

      <div id="homeAlertsBox"></div>

      <h2 class="section-title">Recommended for Kharif season</h2>
      <div id="kharifCropsScroll" class="hscroll"></div>

      <h2 class="section-title">Popular crops</h2>
      <div id="popularCropsScroll" class="hscroll"></div>

      <h2 class="section-title">Quick tools</h2>
      <div class="quickgrid">
        <a href="farm.html" class="quickcard">
          <span>🚜</span>My Farm
        </a>
        <a href="pests.html" class="quickcard">
          <span>🐛</span>Pest Check
        </a>
        <a href="soil.html" class="quickcard">
          <span>🧪</span>Soil Check
        </a>
        <a href="profit.html" class="quickcard">
          <span>💰</span>Profit Calc
        </a>
      </div>
    </div>
  </div>

  <script src="js/farmy-data.js"></script>
  <script src="js/farmy-core.js"></script>
  <script>
    function renderHome() {
      // User Profile
      const user = FarmyState.user || { name: 'Farmer' };
      const name = user.name || 'Farmer';
      $('#homeFarmerName').textContent = `${name} 👋`;
      $('#homeAvatar').textContent = name.charAt(0).toUpperCase();

      // Crops Data
      const crops = window.CROPS || [];
      const kharif = crops.filter(c => c.seasons.some(s => s.toLowerCase().includes('kharif'))).slice(0, 5);
      const popular = [
        findCrop('tomato'),
        findCrop('rice'),
        findCrop('onion'),
        findCrop('banana'),
        findCrop('wheat')
      ].filter(Boolean);

      $('#kharifCropsScroll').innerHTML = kharif.map(cropChipHtml).join('');
      $('#popularCropsScroll').innerHTML = popular.map(cropChipHtml).join('');

      // Weather Data
      const w = FarmyState.weatherCache || getWeatherDemo();
      $('#homeWeatherTemp').textContent = `${w.temp}°C`;
      $('#homeWeatherCond').textContent = w.condition;
      $('#homeWeatherSub').textContent = `Humidity ${w.humidity}% · Rain chance ${w.rainChance}%`;

      const alerts = weatherAlerts(w);
      const alertsBox = $('#homeAlertsBox');
      if (alerts.length) {
        alertsBox.innerHTML = `
          <div class="alertbox">
            ${alerts.map(a => `<div class="alertrow">${a.icon} ${a.text}</div>`).join('')}
          </div>
        `;
      } else {
        alertsBox.innerHTML = '';
      }
    }

    function cropChipHtml(c) {
      if (!c) return '';
      return `
        <a href="crop-detail.html?id=${encodeURIComponent(c.id)}" class="cropchip">
          <span class="chipemoji">${c.emoji}</span>
          <span>${c.name}</span>
        </a>
      `;
    }

    async function loadLiveWeather() {
      if (FarmyState.backendOnline) {
        try {
          const res = await apiFetch('/weather?lat=13.0827&lng=80.2707');
          FarmyState.weatherCache = res;
          renderHome();
        } catch (e) {
          // fallback to demo weather
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderBottomNav('home');
      renderHome();
      checkBackend(() => {
        loadLiveWeather();
      });
    });
  </script>
</body>
</html>
