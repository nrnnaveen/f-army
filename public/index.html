<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FARMY — Smart Farming Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#1E3B2C; --forest-dark:#12261B; --leaf:#4C7A3F; --leaf-light:#EAF2E6;
  --sun:#E3A63A; --sun-dark:#B9832A; --soil:#7A5232; --soil-light:#F1E6D8;
  --paper:#FBF9F3; --card:#FFFFFF; --ink:#1B231C; --ink-soft:#5B655C;
  --line:rgba(27,35,28,0.12); --danger:#B4443B; --danger-bg:#FBEBE9;
  --radius-s:10px; --radius-m:16px; --radius-pill:999px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Work Sans',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
#appwrap{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;position:relative;padding-bottom:78px;}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;margin:0;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select{font-family:inherit;}

.screen{padding:20px 18px 28px;flex:1;}
.content{padding-top:6px;}
.hint{color:var(--ink-soft);font-size:14px;margin:6px 0 14px;line-height:1.5;}

/* Login */
.login-screen{background:linear-gradient(180deg,var(--forest) 0%, var(--forest) 38%, var(--paper) 38%);min-height:100vh;padding:0;}
.login-hero{padding:56px 24px 30px;text-align:center;color:#fff;}
.login-hero.small{padding-top:56px;}
.brandmark{font-size:44px;line-height:1;}
.brand{font-size:38px;color:#fff;letter-spacing:0.5px;margin-top:8px;}
.brand.small{font-size:26px;}
.tagline{color:#DCE9DA;margin-top:6px;font-size:15px;}
.login-card{background:var(--card);margin:0 18px;border-radius:var(--radius-m);padding:26px 22px 30px;box-shadow:0 12px 30px rgba(18,38,27,0.12);}
.segmented{display:flex;background:var(--leaf-light);border-radius:var(--radius-pill);padding:4px;margin-bottom:18px;}
.seg{flex:1;padding:10px 0;border-radius:var(--radius-pill);font-weight:600;font-size:14px;color:var(--forest);}
.seg.active{background:var(--forest);color:#fff;}
.fieldlabel{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin:14px 0 6px;}
.textfield{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:var(--radius-s);font-size:16px;background:#fff;color:var(--ink);}
.textfield:focus{outline:none;border-color:var(--leaf);}
.otp-input{letter-spacing:10px;font-size:24px;text-align:center;font-weight:700;}
.btn-primary{background:var(--forest);color:#fff;padding:15px;border-radius:var(--radius-pill);font-weight:700;font-size:16px;width:100%;margin-top:20px;}
.btn-primary.big{margin-top:22px;}
.btn-primary:active{background:var(--forest-dark);}
.btn-secondary{background:var(--leaf-light);color:var(--forest);padding:14px;border-radius:var(--radius-pill);font-weight:700;font-size:15px;width:100%;margin-top:12px;text-align:center;}
.btn-text{display:block;text-align:center;margin-top:14px;color:var(--forest);font-weight:600;font-size:14px;}
.finetext{text-align:center;color:var(--ink-soft);font-size:12.5px;margin-top:16px;line-height:1.5;}
.demo-otp-note{background:var(--sun-dark);background:#FDF1DC;border:1px solid var(--sun);color:#6B4A12;padding:12px 14px;border-radius:var(--radius-s);font-size:13.5px;line-height:1.5;margin-bottom:8px;}
.demo-otp-note.live{background:#DDF0D8;border-color:#3E9B2C;color:#276B1E;}
.banner{min-height:0;font-size:13px;color:var(--danger);font-weight:600;margin-top:4px;overflow:hidden;max-height:0;transition:max-height .2s;}
.banner.show{max-height:40px;padding-top:4px;}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.topbar h1{font-size:21px;}
.iconbtn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:18px;border-radius:var(--radius-pill);}
.iconbtn.spacer{visibility:hidden;}

/* Home */
.home-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.greeting{color:var(--ink-soft);font-size:14px;margin:0;}
.farmer-name{font-size:24px;margin-top:2px;}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--sun);color:#4A3208;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;}
.searchbar{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);padding:13px 16px;border-radius:var(--radius-pill);color:var(--ink-soft);margin-bottom:14px;width:100%;text-align:left;}
.cta-banner{width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--forest);color:#fff;padding:18px 20px;border-radius:var(--radius-m);margin-bottom:16px;}
.cta-title{font-weight:700;font-size:16px;}
.cta-sub{font-size:12.5px;color:#CFE0CB;margin-top:3px;}
.cta-arrow{font-size:20px;}
.statuspill{display:inline-block;font-size:12px;font-weight:700;padding:6px 12px;border-radius:var(--radius-pill);margin-bottom:14px;}
.statuspill.on{background:#DDF0D8;color:#276B1E;}
.statuspill.off{background:#FDF1DC;color:#8A5F10;}
.alertbox{background:#FDF1DC;border-radius:var(--radius-m);padding:12px 14px;margin-bottom:20px;}
.alertrow{font-size:13px;line-height:1.6;color:#6B4A12;font-weight:600;}
.alertrow:not(:last-child){margin-bottom:4px;}
.weather-card{display:flex;align-items:center;gap:14px;background:var(--soil-light);border-radius:var(--radius-m);padding:16px 18px;margin-bottom:20px;}
.wtemp{font-family:'Fraunces',serif;font-size:34px;color:var(--soil);}
.wdetails{flex:1;font-size:14px;font-weight:600;}
.wsub{color:var(--ink-soft);font-weight:400;font-size:12.5px;margin-top:2px;}
.wmore{font-size:12.5px;color:var(--soil);font-weight:700;}
.section-title{font-size:17px;margin:20px 0 10px;}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin:0 -18px;padding-left:18px;padding-right:18px;}
.cropchip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:var(--radius-m);padding:12px 16px;min-width:76px;font-size:12.5px;font-weight:600;}
.chipemoji{font-size:26px;}
.quickgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;}
.quickcard{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius-m);padding:16px;display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px;}
.quickcard span{font-size:22px;}

/* Lists / cards */
.listrow{width:100%;display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:var(--radius-m);padding:12px 14px;margin-top:10px;text-align:left;}
.listrow-name{font-weight:700;font-size:15px;}
.listrow-sub{color:var(--ink-soft);font-size:12.5px;margin-top:2px;}
.chev{margin-left:auto;color:var(--ink-soft);font-size:20px;}
.croplistitems{margin-top:4px;}

/* Recommendation results */
.reslist{display:flex;flex-direction:column;gap:12px;margin-top:14px;}
.rescard{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:var(--radius-m);padding:16px;text-align:left;}
.rescard-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.rescard-name{font-weight:700;font-size:15.5px;flex:1;}
.rescard-sci{font-weight:400;font-size:12px;color:var(--ink-soft);font-style:italic;}
.badge{font-size:11px;font-weight:800;padding:5px 10px;border-radius:var(--radius-pill);white-space:nowrap;}
.badge.great{background:#DDF0D8;color:#276B1E;}
.badge.good{background:#E7F1E1;color:#3E6B32;}
.badge.ok{background:#FCEED2;color:#8A5F10;}
.badge.bad{background:var(--danger-bg);color:var(--danger);}
.badge.warn2{background:#FCEED2;color:#8A5F10;}
.scorebar{height:7px;border-radius:4px;background:#EEEBE1;overflow:hidden;}
.scorebar-fill{height:100%;border-radius:4px;}
.scorebar-fill.great{background:#3E9B2C;}
.scorebar-fill.good{background:#6DB151;}
.scorebar-fill.ok{background:var(--sun);}
.scorebar-fill.bad{background:var(--danger);}
.score-num{font-size:12px;color:var(--ink-soft);margin-top:4px;font-weight:600;}
.reasonlist{list-style:none;padding:0;margin:10px 0 0;font-size:13.5px;line-height:1.6;}
.reasonlist li.ok{color:#2E6B22;}
.reasonlist li.no{color:var(--danger);}

/* Crop detail */
.crophero{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.crophero-emoji{font-size:44px;}
.crophero-name{font-family:'Fraunces',serif;font-size:22px;}
.crophero-sci{color:var(--ink-soft);font-size:13px;font-style:italic;}
.tabbar{display:flex;gap:6px;overflow-x:auto;border-bottom:1.5px solid var(--line);margin-bottom:16px;}
.tab{flex:0 0 auto;padding:10px 4px;font-weight:700;font-size:13.5px;color:var(--ink-soft);border-bottom:2.5px solid transparent;margin-right:14px;}
.tab.active{color:var(--forest);border-color:var(--forest);}
.infogrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.infobox{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius-s);padding:12px;}
.infolabel{font-size:11.5px;color:var(--ink-soft);font-weight:700;text-transform:none;}
.infoval{font-size:14.5px;font-weight:700;margin-top:3px;}
.subhead{font-size:16px;margin:18px 0 10px;}
.steplist{padding-left:20px;font-size:14px;line-height:1.8;}
.notebox{background:var(--leaf-light);border-radius:var(--radius-s);padding:12px 14px;font-size:13.5px;line-height:1.55;margin-top:10px;}
.notebox.warn{background:#FDF1DC;color:#6B4A12;}
.minitool{margin-top:16px;}
.timeline{display:flex;flex-direction:column;gap:0;}
.tlstep{display:flex;gap:12px;}
.tldot{width:26px;height:26px;border-radius:50%;background:var(--forest);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;position:relative;}
.tlstep:not(:last-child) .tldot::after{content:'';position:absolute;top:26px;left:50%;transform:translateX(-50%);width:2px;height:calc(100% + 6px);background:var(--line);}
.tlbody{padding-bottom:22px;flex:1;}
.tlname{font-weight:700;font-size:14.5px;}
.tldays{color:var(--ink-soft);font-weight:600;font-size:12px;margin-left:6px;}
.tlrow{font-size:13px;line-height:1.6;margin-top:4px;color:var(--ink-soft);}
.tlrow.warn{color:var(--danger);}
.tlrow b{color:var(--ink);}

/* Pest */
.chipgrid{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px;}
.symptomchip{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius-pill);padding:9px 14px;font-size:13px;font-weight:600;}
.symptomchip.active{background:var(--forest);color:#fff;border-color:var(--forest);}
.pestcard{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius-m);padding:14px 16px;}
.pestcard-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.pestname{font-weight:700;font-size:15px;}
.pest-cause{font-size:13.5px;color:var(--ink-soft);line-height:1.5;margin:0 0 6px;}
.pestcard details{font-size:13px;line-height:1.6;}
.pestcard summary{font-weight:700;color:var(--forest);cursor:pointer;margin-bottom:6px;}
.pestcard ul{padding-left:18px;margin:4px 0 10px;}

/* Soil / weather results */
.scorecircle-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:10px 0 6px;}
.scorecircle{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:28px;font-weight:700;color:#fff;background:var(--sun);}
.scorecircle.great{background:#3E9B2C;}
.scorecircle.good{background:#6DB151;}
.scorecircle.ok{background:var(--sun);}
.scorecircle.bad{background:var(--danger);}
.scorecirc-label{font-weight:700;font-size:14px;text-align:center;}
.weather-big{text-align:center;margin:10px 0 16px;}
.wtemp-big{font-family:'Fraunces',serif;font-size:46px;color:var(--soil);}
.forecastrow{display:flex;justify-content:space-between;background:#fff;border:1.5px solid var(--line);border-radius:var(--radius-m);padding:14px 8px;margin-bottom:18px;}
.forecastday{text-align:center;font-size:12px;font-weight:600;flex:1;}
.fc-t{font-weight:800;margin-top:4px;}
.fc-r{color:var(--ink-soft);margin-top:2px;font-size:11px;}

/* Farm */
.emptystate{text-align:center;padding:50px 10px;}
.emptystate-emoji{font-size:44px;}
.emptystate h3{margin-top:10px;font-size:18px;}
.emptystate p{color:var(--ink-soft);font-size:13.5px;margin:8px 0 20px;}
.farmcard{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius-m);padding:16px;}
.farmcard-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;}

/* Yield/profit results */
.resultbox{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius-m);padding:18px;margin-top:16px;}
.resultbox-title{font-size:13px;color:var(--ink-soft);font-weight:700;}
.resultbox-big{font-family:'Fraunces',serif;font-size:26px;color:var(--forest);margin-top:4px;}
.pl-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;}
.pl-row.total{border-bottom:none;font-size:16px;padding-top:12px;}
.pl-row.total.pos b{color:#2E6B22;}
.pl-row.total.neg b{color:var(--danger);}

/* Assistant */
.assistant-body{display:flex;flex-direction:column;height:calc(100vh - 150px);}
.chatlog{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:12px;}
.chatmsg{max-width:82%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.5;}
.chatmsg.assistant{background:var(--leaf-light);color:var(--ink);align-self:flex-start;border-bottom-left-radius:4px;}
.chatmsg.user{background:var(--forest);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
.chatmsg.typing{color:var(--ink-soft);font-style:italic;}
.chatinputrow{display:flex;gap:8px;padding-top:10px;border-top:1.5px solid var(--line);}
.chatinput{flex:1;margin:0;}
.sendbtn{width:auto;padding:0 20px;margin:0;}

/* Bottom nav */
#bottomNav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1.5px solid var(--line);display:none;justify-content:space-around;padding:8px 4px 10px;z-index:20;}
.navitem{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--ink-soft);padding:4px 8px;border-radius:10px;}
.navitem span.navicon{font-size:19px;}
.navitem.active{color:var(--forest);}

@media(min-width:481px){
  #appwrap{border-left:1px solid var(--line);border-right:1px solid var(--line);}
}

</style>
</head>
<body>
<div id="appwrap">
  <div id="app"></div>
  <nav id="bottomNav">
    <button class="navitem" data-screen="home"><span class="navicon">🏠</span>Home</button>
    <button class="navitem" data-screen="recommend"><span class="navicon">🌱</span>Recommend</button>
    <button class="navitem" data-screen="myfarm"><span class="navicon">🚜</span>My Farm</button>
    <button class="navitem" data-screen="tools"><span class="navicon">🧪</span>Tools</button>
    <button class="navitem" data-screen="assistant"><span class="navicon">💬</span>Assistant</button>
  </nav>
</div>

<script>
// ===== FARMY App Logic (v2 — connected to real backend) =====

// The backend lives at /api on the SAME Vercel deployment as this page,
// so there's nothing to configure here — no separate backend URL, no CORS
// setup needed. If every optional env var (Supabase, OpenWeather,
// Anthropic) is left unset, FARMY still runs fully in offline "Demo Mode"
// using its built-in sample data.
const CONFIG = {
  API_BASE_URL: '/api'
};

const state = {
  user:null, session:null, farmId:null, backendOnline:null,
  screen:'login',
  otp:null, otpMode:'demo', pendingContact:'', pendingMethod:'phone', pendingName:'',
  cropDetailId:null, cropDetailCache:null,
  recResults:null,
  soilResult:null,
  pestSelection:new Set(),
  myFarm:[], // local fallback store: {cropId, plantedDate, area}
  farmCropsCache:null,
  weatherCache:null, weatherLoading:false,
  chat:[{role:'assistant', text:"Hello! I'm Farmy Assistant 🌱. Ask me anything about planting, watering, fertilizer, pests, or your farm."}],
  chatBusy:false,
  banner:null
};

const $ = sel => document.querySelector(sel);
const el = (tag, cls, html) => { const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; };

function findCrop(id){ return CROPS.find(c=>c.id===id); }

function go(screen, extra){
  state.screen = screen;
  if(extra) Object.assign(state, extra);
  render();
  window.scrollTo(0,0);
}

// ================= API LAYER =================
async function apiFetch(path, opts={}){
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(state.session && state.session.access_token) headers['Authorization'] = 'Bearer ' + state.session.access_token;
  const res = await fetch(CONFIG.API_BASE_URL + path, Object.assign({}, opts, {headers}));
  let data = null;
  try{ data = await res.json(); }catch(e){ /* no body */ }
  if(!res.ok) throw new Error((data && data.error) || ('Request failed (' + res.status + ')'));
  return data;
}

async function checkBackend(){
  try{
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), 2500);
    const res = await fetch(CONFIG.API_BASE_URL + '/health', {signal: ctrl.signal});
    clearTimeout(t);
    state.backendOnline = !!res.ok;
  }catch(e){ state.backendOnline = false; }
  render();
}

function getBrowserLocation(){
  return new Promise((resolve)=>{
    if(!navigator.geolocation){ resolve({lat:13.0827,lng:80.2707,demo:true}); return; } // default: Chennai
    navigator.geolocation.getCurrentPosition(
      pos => resolve({lat:pos.coords.latitude, lng:pos.coords.longitude, demo:false}),
      () => resolve({lat:13.0827,lng:80.2707,demo:true}),
      {timeout:4000}
    );
  });
}

async function ensureFarm(){
  if(!state.backendOnline || state.farmId) return;
  try{
    const farms = await apiFetch('/farms');
    if(farms && farms.length){ state.farmId = farms[0].id; return; }
    const created = await apiFetch('/farms', {method:'POST', body:JSON.stringify({name:'My Farm'})});
    state.farmId = created.id;
  }catch(e){ console.warn('ensureFarm failed, continuing in local mode:', e.message); }
}

// ---------- OTP / LOGIN ----------
async function sendOtp(){
  const method = state.pendingMethod;
  const input = $('#contactInput').value.trim();
  if(!input){ showBanner('#loginBanner','Please enter your '+ (method==='phone'?'phone number':'email address'),'warn'); return; }
  if(method==='phone' && !/^\d{7,15}$/.test(input.replace(/\s+/g,''))){ showBanner('#loginBanner','Enter a valid phone number (digits only)','warn'); return; }
  if(method==='email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input)){ showBanner('#loginBanner','Enter a valid email address','warn'); return; }
  state.pendingContact = input;

  if(state.backendOnline){
    try{
      await apiFetch('/auth/send-otp', {method:'POST', body:JSON.stringify({contact:input, method})});
      state.otpMode = 'live';
      go('otp');
      return;
    }catch(e){
      console.warn('Live OTP send failed, falling back to demo mode:', e.message);
    }
  }
  // Demo fallback — no reachable backend (or Supabase phone/email provider not yet configured)
  state.otp = String(Math.floor(1000 + Math.random()*9000));
  state.otpMode = 'demo';
  go('otp');
}

async function verifyOtp(){
  const entered = $('#otpInput').value.trim();

  if(state.otpMode==='live'){
    try{
      const data = await apiFetch('/auth/verify-otp', {method:'POST', body:JSON.stringify({
        contact: state.pendingContact, method: state.pendingMethod, code: entered, fullName: state.pendingName
      })});
      state.session = data.session;
      state.user = { id:data.user.id, name: state.pendingName || (state.pendingMethod==='phone'?'Farmer':state.pendingContact.split('@')[0]), contact: state.pendingContact, method: state.pendingMethod };
      await ensureFarm();
      go('home');
    }catch(e){
      showBanner('#otpBanner', e.message, 'warn');
    }
    return;
  }

  // Demo fallback verification
  if(entered === state.otp){
    state.user = { name: state.pendingName || (state.pendingMethod==='phone'?'Farmer':state.pendingContact.split('@')[0]), contact: state.pendingContact, method: state.pendingMethod };
    go('home');
  } else {
    showBanner('#otpBanner','Incorrect code. Please try again.','warn');
  }
}

function showBanner(sel, msg, kind){
  const b = $(sel); if(!b) return;
  b.textContent = msg; b.className = 'banner show ' + (kind||'');
  clearTimeout(b._t); b._t = setTimeout(()=>{ b.className='banner'; }, 4000);
}

// ---------- WEATHER ----------
function getWeatherDemo(){
  return { temp: 29, humidity: 68, condition:'Partly cloudy (demo data)', rainChance: 30, forecast:[
    {d:'Today',t:29,r:30},{d:'Tomorrow',t:31,r:10},{d:'Wed',t:27,r:60},{d:'Thu',t:28,r:45},{d:'Fri',t:30,r:15}
  ]};
}
function weatherAlerts(w){
  const alerts=[];
  if(w.rainChance>=60) alerts.push({icon:'🚨',text:'Heavy rain expected — consider skipping irrigation today.'});
  if(w.temp>=34) alerts.push({icon:'🔥',text:'High temperature — increase irrigation monitoring for heat-sensitive crops.'});
  if(w.humidity>=80) alerts.push({icon:'🐛',text:'High humidity may increase fungal disease risk — inspect crops closely.'});
  if(alerts.length===0) alerts.push({icon:'✅',text:'No major weather risks right now — normal care applies.'});
  return alerts;
}
async function loadWeather(){
  if(state.weatherCache) return state.weatherCache;
  if(state.backendOnline){
    try{
      const coords = await getBrowserLocation();
      const data = await apiFetch(`/weather?lat=${coords.lat}&lng=${coords.lng}`);
      state.weatherCache = data;
      return data;
    }catch(e){ console.warn('Live weather failed, using demo weather:', e.message); }
  }
  state.weatherCache = getWeatherDemo();
  return state.weatherCache;
}
async function triggerWeatherLoad(){
  if(state.weatherLoading || state.weatherCache) return;
  state.weatherLoading = true;
  await loadWeather();
  state.weatherLoading = false;
  render();
}

// ---------- LOCAL FALLBACK: RECOMMENDATION ENGINE ----------
function scoreCropLocal(crop, cond){
  let score = 0, reasons = [];
  if(cond.ph!=null){
    if(cond.ph>=crop.ph[0] && cond.ph<=crop.ph[1]){ score+=25; reasons.push({ok:true,text:`Soil pH ${cond.ph} is within the ideal ${crop.ph[0]}–${crop.ph[1]} range`}); }
    else { const dist=Math.min(Math.abs(cond.ph-crop.ph[0]),Math.abs(cond.ph-crop.ph[1])); score+=Math.max(0,25-dist*20); reasons.push({ok:false,text:`Soil pH ${cond.ph} is outside the ideal ${crop.ph[0]}–${crop.ph[1]} range`}); }
  }
  if(cond.temp!=null){
    if(cond.temp>=crop.temp[0] && cond.temp<=crop.temp[1]){ score+=25; reasons.push({ok:true,text:`Temperature ${cond.temp}°C fits the ideal ${crop.temp[0]}–${crop.temp[1]}°C range`}); }
    else { const dist=Math.min(Math.abs(cond.temp-crop.temp[0]),Math.abs(cond.temp-crop.temp[1])); score+=Math.max(0,25-dist*2.5); reasons.push({ok:false,text:`Temperature ${cond.temp}°C is outside the ideal ${crop.temp[0]}–${crop.temp[1]}°C range`}); }
  }
  if(cond.soil){
    if(crop.soils.includes(cond.soil)){ score+=20; reasons.push({ok:true,text:`${cond.soil} soil suits this crop`}); }
    else { score+=5; reasons.push({ok:false,text:`${cond.soil} soil isn't ideal — best suited to ${crop.soils.join(' or ')}`}); }
  }
  if(cond.waterAvail){
    const order = {Low:0,Medium:1,High:2};
    const need = order[crop.water.split('-')[0]] ?? 1;
    const have = order[cond.waterAvail];
    if(have>=need){ score+=15; reasons.push({ok:true,text:`Your water availability (${cond.waterAvail}) meets this crop's ${crop.water} requirement`}); }
    else { score+=Math.max(0,15-(need-have)*8); reasons.push({ok:false,text:`Your water availability (${cond.waterAvail}) is below this crop's ${crop.water} requirement`}); }
  }
  if(cond.season){
    const seasonMatch = crop.seasons.some(s=>s.toLowerCase().includes(cond.season.toLowerCase()));
    if(seasonMatch){ score+=15; reasons.push({ok:true,text:`${cond.season} matches this crop's growing season`}); }
    else { reasons.push({ok:false,text:`${cond.season} is not this crop's typical season (best: ${crop.seasons.join(', ')})`}); }
  }
  score = Math.round(Math.max(0,Math.min(100,score)));
  let label, cls;
  if(score>=80){label='Highly Suitable';cls='great';}
  else if(score>=60){label='Suitable';cls='good';}
  else if(score>=40){label='Moderately Suitable';cls='ok';}
  else {label='Not Recommended';cls='bad';}
  return {crop, score, label, cls, reasons};
}
function runRecommendationLocal(cond){
  return CROPS.map(c=>scoreCropLocal(c,cond)).sort((a,b)=>b.score-a.score);
}
async function runRecommendation(cond){
  if(state.backendOnline){
    try{
      const results = await apiFetch('/recommend', {method:'POST', body:JSON.stringify(cond)});
      state.recResults = results.map(r=>({ crop: findCrop(r.crop.id) || r.crop, score:r.score, label:r.label,
        cls: r.score>=80?'great':r.score>=60?'good':r.score>=40?'ok':'bad', reasons:r.reasons }));
      return;
    }catch(e){ console.warn('Live recommend failed, using local engine:', e.message); }
  }
  state.recResults = runRecommendationLocal(cond);
}

// ---------- LOCAL FALLBACK: SOIL HEALTH ----------
function soilHealthScoreLocal(s){
  let score=0, notes=[];
  const npkScore = v => v==='Medium'?10:(v==='High'?8:4);
  score += npkScore(s.n) + npkScore(s.p) + npkScore(s.k);
  if(s.n==='Low') notes.push('Nitrogen is low — consider adding compost, FYM, or a nitrogen-rich fertilizer.');
  if(s.p==='Low') notes.push('Phosphorus is low — consider rock phosphate or DAP application.');
  if(s.k==='Low') notes.push('Potassium is low — consider potash (MOP) application.');
  const phDist = Math.abs(s.ph - 6.5);
  score += Math.max(0, 10 - phDist*6);
  if(s.ph<6.0) notes.push('Soil is acidic — agricultural lime can help raise pH gradually.');
  if(s.ph>7.5) notes.push('Soil is alkaline — organic matter and gypsum can help over time.');
  const moistScore = s.moisture==='Medium'?10:(s.moisture==='High'?7:5);
  score += moistScore;
  if(s.moisture==='Low') notes.push('Soil moisture is low — increase irrigation frequency or add mulch.');
  if(s.moisture==='High') notes.push('Soil moisture is high — check drainage to avoid root rot.');
  score = Math.round(Math.min(100,(score/50)*100));
  let label = score>=75?'Good':(score>=50?'Fair':'Needs Improvement');
  return {score,label,notes};
}
function compareSoilToCropLocal(s, crop){
  const msgs=[];
  if(s.ph<crop.ph[0]) msgs.push({icon:'⚠️',text:`Your soil pH (${s.ph}) is lower than the ideal range for ${crop.name} (${crop.ph[0]}–${crop.ph[1]}).`});
  else if(s.ph>crop.ph[1]) msgs.push({icon:'⚠️',text:`Your soil pH (${s.ph}) is higher than the ideal range for ${crop.name} (${crop.ph[0]}–${crop.ph[1]}).`});
  else msgs.push({icon:'✅',text:`Your soil pH (${s.ph}) fits ${crop.name}'s ideal range (${crop.ph[0]}–${crop.ph[1]}).`});
  if(!crop.soils.includes(s.type)) msgs.push({icon:'⚠️',text:`${crop.name} grows best in ${crop.soils.join(' or ')} — your soil is ${s.type}.`});
  else msgs.push({icon:'✅',text:`${s.type} soil is well suited to ${crop.name}.`});
  return msgs;
}
async function submitSoilCheck(s){
  if(state.backendOnline){
    try{
      const data = await apiFetch('/soil/check', {method:'POST', body:JSON.stringify({
        soilType:s.type, ph:s.ph, nitrogenLevel:s.n, phosphorusLevel:s.p, potassiumLevel:s.k, moistureLevel:s.moisture
      })});
      return { input:s, health:{score:data.score, label:data.label, notes:data.notes} };
    }catch(e){ console.warn('Live soil check failed, using local scoring:', e.message); }
  }
  return { input:s, health: soilHealthScoreLocal(s) };
}
async function fetchSoilCompare(s, cropId){
  if(state.backendOnline){
    try{
      return await apiFetch('/soil/compare', {method:'POST', body:JSON.stringify({ph:s.ph, soilType:s.type, cropId})});
    }catch(e){ console.warn('Live soil compare failed, using local comparison:', e.message); }
  }
  return compareSoilToCropLocal(s, findCrop(cropId));
}

// ---------- WEATHER SUITABILITY (local — same logic either way) ----------
function weatherSuitability(crop, w){
  const msgs=[]; let score=100;
  if(w.temp<crop.temp[0]||w.temp>crop.temp[1]){ msgs.push({icon:'❌',text:`Current temperature (${w.temp}°C) is outside ${crop.name}'s ideal range (${crop.temp[0]}–${crop.temp[1]}°C).`}); score-=30; }
  else msgs.push({icon:'✅',text:`Current temperature (${w.temp}°C) suits ${crop.name}.`});
  if(w.humidity>crop.humidity[1]+15){ msgs.push({icon:'⚠️',text:`Humidity (${w.humidity}%) is quite high for ${crop.name} — risk of fungal disease may increase.`}); score-=15; }
  else if(w.humidity<crop.humidity[0]-15){ msgs.push({icon:'⚠️',text:`Humidity (${w.humidity}%) is quite low for ${crop.name}.`}); score-=10; }
  else msgs.push({icon:'✅',text:`Humidity (${w.humidity}%) is acceptable for ${crop.name}.`});
  if(w.rainChance>60 && crop.water==='Low'){ msgs.push({icon:'⚠️',text:`Heavy rain expected — ${crop.name} prefers drier conditions, watch for waterlogging.`}); score-=10; }
  return {msgs, score: Math.max(0,score)};
}

// ---------- LOCAL FALLBACK: YIELD & PROFIT ----------
function predictYieldLocal(crop, area, soilScore, method){
  const [lo,hi] = crop.yieldPerAcre;
  let mult = 0.75 + (soilScore/100)*0.4;
  if(method==='organic') mult *= 0.92;
  const low = Math.round(lo*area*mult*0.9);
  const high = Math.round(hi*area*mult*1.05);
  return {low, high, unit:'kg'};
}
async function submitYieldPrediction(cropId, area, soilScore, method){
  if(state.backendOnline){
    try{
      const farmCropId = null;
      const data = await apiFetch('/yield/predict', {method:'POST', body:JSON.stringify({farmCropId, cropId, areaAcres:area, soilHealthScore:soilScore, farmingMethod:method})});
      return {low:data.low, high:data.high, unit:data.unit};
    }catch(e){ console.warn('Live yield predict failed, using local formula:', e.message); }
  }
  return predictYieldLocal(findCrop(cropId), area, soilScore, method);
}
async function submitProfitCalc(payload){
  if(state.backendOnline){
    try{
      const data = await apiFetch('/profit/calculate', {method:'POST', body:JSON.stringify(payload)});
      return { cost:data.totalCost, revenue:data.expectedRevenue, profit:data.estimatedProfit, perAcre:data.profitPerAcre };
    }catch(e){ console.warn('Live profit calc failed, using local math:', e.message); }
  }
  const cost = payload.seedCost+payload.fertilizerCost+payload.labourCost+payload.irrigationCost+payload.otherCost;
  const revenue = payload.expectedYield*payload.sellingPrice;
  const profit = revenue-cost;
  return { cost, revenue, profit, perAcre: Math.round(profit/(payload.areaAcres||1)) };
}

function render(){
  const root = $('#app');
  root.innerHTML = '';
  root.appendChild(renderScreen());
  const nav = $('#bottomNav');
  if(state.user && !['login','otp'].includes(state.screen)){
    nav.style.display='flex';
    document.querySelectorAll('#bottomNav .navitem').forEach(b=>{
      b.classList.toggle('active', b.dataset.screen===topLevel(state.screen));

}

function topLevel(s){
  if(['cropDetail','cropList','recommend'].includes(s)) return 'recommend';
  if(['soil','pest','weather'].includes(s)) return 'tools';
  if(s==='myfarm') return 'myfarm';
  if(s==='assistant') return 'assistant';
  return 'home';
}

function header(title, back){
  const h = el('div','topbar');

function statusPill(){
  if(state.backendOnline===null) return '';

    ? `<div class="statuspill on">🟢 Connected to live backend</div>`
    : `<div class="statuspill off">🟡 Demo mode — backend not reachable, showing sample data</div>`;

function renderScreen(){
  switch(state.screen){
    case 'login': return screenLogin();

    case 'home': return screenHome();
    case 'recommend': return screenRecommend();
    case 'cropList': return screenCropList();

function pestMatchLocal(sel){
  const matches = Object.entries(PESTS).map(([id,p])=>({id,...p,matchCount:sel.filter(s=>p.tags.includes(s)).length})).filter(p=>p.matchCount>0).sort((a,b)=>b.matchCount-a.matchCount);
  return matches;
}
async function refreshPestResults(){
  const target = $('#pestResults'); if(!target) return;
  const sel = [...state.pestSelection];
  if(sel.length===0){ target.innerHTML = '<p class="hint">Pick one or more symptoms above to see likely causes.</p>'; return; }
  let matches;
  if(state.backendOnline){
    try{
      const data = await apiFetch('/pests/match', {method:'POST', body:JSON.stringify({symptoms:sel})});
      matches = data.map(p=>({ id:p.id, name:p.name, type:p.type, cause:p.cause,
        prevention:p.prevention, organic:p.organic_control, mechanical:p.mechanical_control,
        chemical:{active:p.chemical_active_ingredient, warning:p.chemical_warning, ppe:p.chemical_ppe, phi:p.chemical_phi} }));
    }catch(e){ console.warn('Live pest match failed, using local data:', e.message); matches = pestMatchLocal(sel); }
  } else {
    matches = pestMatchLocal(sel);
  }
  if(!$('#pestResults')) return;
  if(matches.length===0){ target.innerHTML = '<p class="hint">No close matches found — consider consulting a local agricultural extension officer.</p>'; return; }
  target.innerHTML = `<div class="reslist">${matches.slice(0,5).map(p=>`
    <div class="pestcard">
      <div class="pestcard-top"><span class="badge ${p.type==='Pest'?'ok':'warn2'}">${p.type}</span><span class="pestname">${p.name}</span></div>
      <p class="pest-cause">${p.cause}</p>
      <details><summary>Prevention & IPM options</summary>
        <b>Prevention</b><ul>${p.prevention.map(x=>`<li>${x}</li>`).join('')}</ul>
        <b>Organic control</b><ul>${p.organic.map(x=>`<li>${x}</li>`).join('')}</ul>
        <b>Mechanical control</b><ul>${p.mechanical.map(x=>`<li>${x}</li>`).join('')}</ul>
        ${!/No (reliable curative|direct cure)/.test(p.chemical.active) ? `<b>If chemical control is needed</b>
        <ul><li>Active ingredient: ${p.chemical.active}</li><li>${p.chemical.warning}</li><li>Protective equipment: ${p.chemical.ppe}</li><li>Pre-harvest interval: ${p.chemical.phi}</li></ul>` : `<p class="notebox">${p.chemical.active}</p>`}
      </details>
    </div>`).join('')}</div>`;
}

function weatherCompareHtml(cropId,w){
  const crop = findCrop(cropId);
  const {msgs,score} = weatherSuitability(crop,w);
  const verdict = score>=80?`✅ Weather is suitable for growing ${crop.name}`:score>=55?`⚠️ Weather is borderline for ${crop.name}`:`❌ Weather is currently unsuitable for ${crop.name}`;
  return `<div class="scorecircle-wrap"><div class="scorecircle ${score>=80?'great':score>=55?'ok':'bad'}">${score}</div><div class="scorecirc-label">${verdict}</div></div>
  <ul class="reasonlist">${msgs.map(m=>`<li>${m.icon} ${m.text}</li>`).join('')}</ul>`;
}

function screenMyFarm(){

async function loadFarmCrops(){
  let crops = null;
  if(state.backendOnline && state.farmId){
    try{
      const data = await apiFetch(`/farms/${state.farmId}/crops`);
      crops = data.map(fc=>({ cropId:fc.crop_id, area:fc.area_acres, plantedDate:fc.planted_date, harvestDate:fc.expected_harvest_date, daysSince:fc.days_since_planting, stage:fc.current_stage, backendId:fc.id }));
    }catch(e){ console.warn('Live farm load failed, using local list:', e.message); }
  }
  if(crops===null) crops = state.myFarm.map(f=>({...f}));
  const body = $('#myFarmBody'); if(!body) return;
  if(crops.length===0){
    body.innerHTML = `<div class="emptystate"><div class="emptystate-emoji">🌱</div><h3>No crops added yet</h3><p>Add a crop from its detail page to start tracking watering, fertilizer, and harvest tasks.</p><button class="btn-primary big" onclick="go('cropList')">Browse Crops</button></div>`;
  } else {
    body.innerHTML = `<div class="reslist">${crops.map((f,i)=>farmCardHtml(f,i)).join('')}</div>
    <button class="btn-secondary big" onclick="go('cropList')">➕ Add another crop</button>`;
  }
}
function farmCardHtml(f,i){
  const crop = findCrop(f.cropId);
  let days = f.daysSince, stage = f.stage, harvestDate = f.harvestDate;
  if(days===undefined){
    days = Math.floor((Date.now()-new Date(f.plantedDate))/86400000);
    stage = crop.stages[0].name;
    for(const s of crop.stages){ const end = parseInt(s.days.split(/[–-]/).pop()); if(days<=end){ stage=s.name; break; } }
    harvestDate = new Date(new Date(f.plantedDate).getTime() + crop.duration*86400000).toISOString().slice(0,10);
  }
  return `<div class="farmcard">
    <div class="farmcard-top"><span class="chipemoji">${crop.emoji}</span><div><div class="listrow-name">${crop.name}</div><div class="listrow-sub">${f.area} acre(s) · Planted ${f.plantedDate}</div></div>
      <button class="iconbtn" onclick="removeFarmCrop(${i})">🗑</button></div>
    <div class="infogrid">
      <div class="infobox"><div class="infolabel">Days since planting</div><div class="infoval">${days<0?0:days}</div></div>
      <div class="infobox"><div class="infolabel">Current stage</div><div class="infoval">${stage}</div></div>
      <div class="infobox"><div class="infolabel">Next watering</div><div class="infoval">${crop.irrigation.split(';')[0]}</div></div>
      <div class="infobox"><div class="infolabel">Expected harvest</div><div class="infoval">${harvestDate}</div></div>
    </div>
    <button class="btn-secondary" onclick="go('cropDetail',{cropDetailId:'${crop.id}',cropDetailCache:null})">View full crop guide →</button>
  </div>`;
}
function removeFarmCrop(i){ state.myFarm.splice(i,1); render(); } // local-only remove; backend delete endpoint can be added if needed

// ---- AI ASSISTANT ----
function screenAssistant(){
  const wrap = el('div','screen assistant-screen');
  wrap.appendChild(header('Farmy Assistant','home'));
  const body = el('div','content assistant-body');
  body.innerHTML = `<div id="chatlog" class="chatlog">${state.chat.map(m=>`<div class="chatmsg ${m.role}">${m.text}</div>`).join('')}${state.chatBusy?'<div class="chatmsg assistant typing">Thinking…</div>':''}</div>
    <div class="chatinputrow">
      <input id="chatInput" class="textfield chatinput" placeholder="Ask about planting, water, pests…" onkeydown="if(event.key==='Enter')sendChat()">
      <button class="btn-primary sendbtn" onclick="sendChat()">Send</button>
    </div>`;
  wrap.appendChild(body);
  setTimeout(()=>{ const l=$('#chatlog'); if(l) l.scrollTop=l.scrollHeight; },0);
  return wrap;
}
async function sendChat(){
  const input = $('#chatInput'); const text = input.value.trim();
  if(!text || state.chatBusy) return;
  state.chat.push({role:'user',text});
  input.value='';
  state.chatBusy = true;
  render();

  let replyText;
  if(state.backendOnline && state.session){
    try{
      const data = await apiFetch('/assistant/ask', {method:'POST', body:JSON.stringify({message:text, history:state.chat.slice(0,-1)})});
      replyText = data.reply;
    }catch(e){
      console.warn('Live assistant failed:', e.message);
      replyText = assistantLocalFallback(text);
    }
  } else {
    replyText = assistantLocalFallback(text);
  }
  state.chat.push({role:'assistant', text: replyText});
  state.chatBusy = false;
  render();
}

// Offline/unauthenticated fallback: a small rule-based helper using the
// built-in crop database, so the Assistant tab still gives useful answers
// in Demo Mode (no server-side AI key is ever exposed to the browser).
function assistantLocalFallback(text){
  const q = text.toLowerCase();
  const mentioned = CROPS.find(c => q.includes(c.name.toLowerCase().split(' ')[0]));
  if(mentioned){
    if(/water|irrigat/.test(q)) return `${mentioned.name} needs ${mentioned.water.toLowerCase()} water — ${mentioned.irrigation}. The most critical stage for water is: ${mentioned.waterCritical}.`;
    if(/fertil|npk|nutrient/.test(q)) return `${mentioned.name}'s typical fertilizer need is N:${mentioned.npk.n} P:${mentioned.npk.p} K:${mentioned.npk.k}${mentioned.npk.note?' ('+mentioned.npk.note+')':' kg/acre'}. ${mentioned.fertNote}`;
    if(/pest|disease|insect|bug/.test(q)) return `Common issues for ${mentioned.name} include: ${mentioned.pests.map(id=>PESTS[id]?.name).filter(Boolean).join(', ')}. Open the Pest Check tool and select your symptoms for detailed guidance.`;
    if(/plant|sow|grow|start/.test(q)) return `To plant ${mentioned.name}: ${mentioned.planting[0]} Best season: ${mentioned.seasons.join(', ')} (${mentioned.months}). See the crop's Overview tab for the full planting guide.`;
    return `${mentioned.name} grows best in ${mentioned.soils.join(' or ')} soil, pH ${mentioned.ph[0]}–${mentioned.ph[1]}, ${mentioned.temp[0]}–${mentioned.temp[1]}°C. Duration: about ${mentioned.duration} days. Open the crop page for the full guide.`;
  }
  return "I'm running in offline Demo Mode right now, so I can only answer basic questions about crops in the database (try naming a crop, like \"how much water does tomato need\"). Connect the live backend with an AI key for full conversational answers — see the README.";
}
